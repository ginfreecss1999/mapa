<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mapa de Objetivos</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        /* --- ESTILOS NATIVOS: MODO OSCURO DEFINITIVO --- */
        :root {
            --fondo: #0f172a; 
            --puntos: #334155; 
            --cuadro-bg: #1e293b; 
            --texto: #f8fafc; 
            --texto-secundario: #94a3b8; 
            --borde-btn: #334155;
            --bg-btn: #1e293b;
            --bg-btn-hover: #334155;
            --linea: #475569;
            --paso-bg: #0f172a;
            --paso-hover: #334155;
            --sombra: rgba(0,0,0,0.4);
            --sombra-fuerte: rgba(0,0,0,0.6);
            --panel-bg: #1e293b;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: var(--fondo);
            background-image: radial-gradient(var(--puntos) 1.5px, transparent 1.5px);
            background-size: 20px 20px; 
            color: var(--texto);
        }

        .animar-camara { transition: transform 0.5s ease-in-out !important; }
        body.animar-camara { transition: background-position 0.5s ease-in-out !important; }

        #lienzo { width: 100vw; height: 100vh; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
        html { overflow: hidden; }
        #lienzo:active { cursor: grabbing; }

        #contenedor-mapa {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 0 0;
            will-change: transform; 
        }

        #capa-lineas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; 
        }

        .grupo-conexion { pointer-events: auto; cursor: pointer; }

        .cuadro {
            position: absolute; width: 220px; background-color: var(--cuadro-bg);
            border-top: 6px solid #3b82f6; border-radius: 8px; padding: 10px;
            box-shadow: 0 4px 6px var(--sombra); cursor: grab; user-select: none;
            transition: opacity 0.3s, transform 0.2s, box-shadow 0.2s, background-color 0.3s; 
            will-change: left, top; 
        }

        .cuadro.animar-movimiento {
            transition: left 0.5s ease-in-out, top 0.5s ease-in-out, opacity 0.3s, transform 0.2s, box-shadow 0.2s, background-color 0.3s !important;
        }

        .cuadro:active { cursor: grabbing; transform: scale(1.02); box-shadow: 0 10px 15px var(--sombra-fuerte); z-index: 999; }
        .cuadro.completado { opacity: 0.5; }
        .cuadro.completado .titulo { text-decoration: line-through; color: var(--texto-secundario); }
        .cuadro.estado-bloqueado { opacity: 0.55; filter: saturate(0.4); }
        .cuadro.estado-disponible { box-shadow: 0 0 0 2px #10b981, 0 0 14px rgba(16, 185, 129, 0.45); }
        .cuadro.resaltado-foco { animation: pulsoFoco 0.6s ease-in-out 3; }
        @keyframes pulsoFoco { 50% { transform: scale(1.06); } }
        .progreso { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; }
        .progreso-barra { flex: 1; height: 6px; border-radius: 3px; background: rgba(148, 163, 184, 0.3); overflow: hidden; }
        .progreso-relleno { height: 100%; background: #10b981; transition: width 0.3s; }
        .progreso-texto { font-size: 11px; font-weight: bold; color: var(--texto-secundario); }
        .meta-cuadro { display: flex; flex-wrap: wrap; row-gap: 4px; align-items: center; gap: 6px; margin-top: 6px; min-height: 22px; }
        .meta-cuadro .vacio { opacity: 0; }
        .cuadro:hover .meta-cuadro .vacio, .meta-cuadro:focus-within .vacio { opacity: 0.6; }
        .meta-fecha { background: transparent; border: 1px solid transparent; color: var(--texto-secundario); font-size: 11px; font-family: inherit; padding: 1px 3px; border-radius: 6px; width: 112px; color-scheme: dark; }
        .meta-fecha.vencida { color: #f87171; border-color: rgba(248, 113, 113, 0.5); }
        .meta-fecha.proxima { color: #fbbf24; border-color: rgba(251, 191, 36, 0.5); }
        .meta-chip { background: rgba(148, 163, 184, 0.15); border: 1px solid transparent; color: var(--texto-secundario); font-size: 11px; font-weight: bold; font-family: inherit; padding: 2px 7px; border-radius: 10px; cursor: pointer; }
        .meta-prioridad.p3 { color: #f87171; background: rgba(248, 113, 113, 0.15); }
        .meta-prioridad.p2 { color: #fbbf24; background: rgba(251, 191, 36, 0.15); }
        .meta-prioridad.p1 { color: #60a5fa; background: rgba(96, 165, 250, 0.15); }
        .meta-esfuerzo.e1 { color: #34d399; background: rgba(52, 211, 153, 0.15); }
        .meta-esfuerzo.e2 { color: #a78bfa; background: rgba(167, 139, 250, 0.15); }
        .meta-esfuerzo.e3 { color: #fb923c; background: rgba(251, 146, 60, 0.15); }
        #vista-lista { display: none; position: fixed; top: 0; left: 260px; right: 0; bottom: 0; z-index: 900; background: var(--fondo); overflow: auto; padding: 80px 24px 90px; box-sizing: border-box; }
        body.modo-lista #vista-lista { display: block; }
        body.modo-lista #papelera { display: none; }
        #lv-contenido { max-width: 1100px; margin: 0 auto; }
        #lv-barra { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        #lv-resumen { font-size: 13px; color: var(--texto-secundario); }
        #lv-filtros { display: flex; gap: 4px; }
        #lv-filtros button { font-size: 12px; font-family: inherit; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--borde-btn); background: transparent; color: var(--texto-secundario); cursor: pointer; }
        #lv-filtros button.activo { background: #3b82f6; border-color: #3b82f6; color: white; }
        #lv-nueva { width: 100%; box-sizing: border-box; padding: 9px 12px; margin-bottom: 10px; border-radius: 8px; border: 2px solid var(--borde-btn); background: var(--bg-btn); color: var(--texto); font-size: 14px; font-family: inherit; outline: none; }
        #lv-nueva:focus { border-color: #3b82f6; }
        .lv-fila, #lv-cabecera { display: grid; grid-template-columns: 30px minmax(180px, 1fr) 90px 100px 130px 90px minmax(120px, 220px) 44px; gap: 10px; align-items: center; min-width: 820px; }
        #lv-cabecera { padding: 4px 16px; font-size: 11px; font-weight: bold; color: var(--texto-secundario); }
        #lv-cabecera span[data-ord] { cursor: pointer; user-select: none; }
        #lv-cabecera span[data-ord]:hover { color: var(--texto); }
        .lv-fila { padding: 8px 12px; margin-bottom: 6px; background: var(--cuadro-bg); border-radius: 8px; border-left: 4px solid var(--linea); }
        .lv-fila.lv-disponible { border-left-color: #10b981; }
        .lv-fila.lv-bloqueada { opacity: 0.65; }
        .lv-fila.lv-completada { opacity: 0.5; }
        .lv-chk { width: 18px; height: 18px; accent-color: #10b981; cursor: pointer; }
        .lv-titulo { width: 100%; box-sizing: border-box; background: transparent; border: 1px solid transparent; color: var(--texto); font-size: 14px; font-weight: bold; font-family: inherit; padding: 3px 6px; border-radius: 6px; }
        .lv-titulo:focus { border-color: #3b82f6; outline: none; background: var(--bg-btn); }
        .lv-completada .lv-titulo { text-decoration: line-through; color: var(--texto-secundario); }
        .lv-sub { font-size: 11px; color: var(--texto-secundario); padding: 0 6px; }
        .lv-vacio-chip { opacity: 0.45; }
        .lv-extras, .lv-etiquetas { display: flex; flex-wrap: wrap; gap: 4px; }
        .lv-ir { background: none; border: none; cursor: pointer; font-size: 16px; }
        .lv-ceros { padding: 30px; text-align: center; color: var(--texto-secundario); font-size: 14px; }
        .meta-nota.con-nota { color: #fcd34d; background: rgba(252, 211, 77, 0.15); }
        #panel-nota { display: none; position: fixed; z-index: 1002; width: 300px; box-sizing: border-box; padding: 8px; background: var(--cuadro-bg); color: var(--texto); border: 2px solid var(--borde-btn); border-radius: 10px; box-shadow: 0 8px 20px var(--sombra-fuerte); }
        #panel-nota .nota-cab { font-size: 11px; color: var(--texto-secundario); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #panel-nota textarea { width: 100%; box-sizing: border-box; min-height: 140px; max-height: 50vh; resize: vertical; padding: 8px; border-radius: 6px; border: 1px solid var(--borde-btn); background: var(--bg-btn); color: var(--texto); font-family: inherit; font-size: 13px; line-height: 1.4; outline: none; }
        #panel-nota textarea:focus { border-color: #3b82f6; }
        .meta-repetir.rep { color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
        .meta-tag { background: hsla(var(--h), 70%, 60%, 0.18); color: hsl(var(--h), 80%, 72%); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cuadro.filtrado-fuera { opacity: 0.15 !important; box-shadow: none !important; }
        #btn-filtro { position: fixed; top: 20px; right: 290px; z-index: 1000; height: 36px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #btn-filtro.activo { background: #3b82f6; border-color: #3b82f6; color: white; }
        #menu-etiquetas { display: none; position: fixed; z-index: 1002; min-width: 210px; max-width: 260px; max-height: 50vh; overflow-y: auto; background: var(--cuadro-bg); color: var(--texto); border: 2px solid var(--borde-btn); border-radius: 10px; box-shadow: 0 8px 20px var(--sombra-fuerte); padding: 6px; }
        .menu-eti-titulo { font-size: 11px; color: var(--texto-secundario); padding: 4px 8px; }
        .menu-eti-fila { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .menu-eti-fila:hover { background: rgba(148, 163, 184, 0.15); }
        .menu-eti-check { width: 14px; font-weight: bold; color: #10b981; }
        .menu-eti-punto { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h), 75%, 60%); flex-shrink: 0; }
        .menu-eti-input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--borde-btn); background: var(--bg-btn); color: var(--texto); font-size: 13px; font-family: inherit; outline: none; }
        .menu-eti-input:focus { border-color: #3b82f6; }
        #ahora-orden { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        #ahora-orden button { font-size: 11px; font-weight: normal; font-family: inherit; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--borde-btn); background: transparent; color: var(--texto-secundario); cursor: pointer; }
        #ahora-orden button.activo { background: #3b82f6; border-color: #3b82f6; color: white; }
        #panel-ahora { display: none; position: fixed; bottom: 70px; right: 20px; width: 340px; max-height: 55vh; overflow-y: auto; background: var(--cuadro-bg); color: var(--texto); border: 2px solid var(--borde-btn); border-radius: 10px; box-shadow: 0 8px 20px var(--sombra-fuerte); z-index: 1000; }
        #ahora-cabecera { position: sticky; top: 0; padding: 10px 12px; font-weight: bold; font-size: 14px; background: var(--cuadro-bg); border-bottom: 1px solid var(--borde-btn); }
        .ahora-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-bottom: 1px solid var(--borde-btn); }
        .ahora-item input { margin-top: 3px; cursor: pointer; accent-color: #10b981; }
        .ahora-texto { flex: 1; cursor: pointer; font-size: 14px; line-height: 1.3; word-break: break-word; }
        .ahora-texto:hover span { text-decoration: underline; }
        .ahora-texto small { display: block; margin-top: 2px; font-size: 11px; color: var(--texto-secundario); }
        .ahora-vacio { padding: 16px 12px; font-size: 13px; color: var(--texto-secundario); }
        .cuadro.oculto { visibility: hidden; opacity: 0; pointer-events: none; }
        .btn-colapsar { background: none; border: none; padding: 0 2px; cursor: pointer; font-size: 12px; font-weight: bold; color: var(--texto-secundario); }
        .btn-colapsar:hover { color: var(--texto); }
        #caja-buscar { position: fixed; top: 20px; right: 20px; width: 260px; z-index: 1000; }
        #buscador { width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; border: 2px solid var(--borde-btn); background: var(--bg-btn); color: var(--texto); font-size: 13px; outline: none; }
        #buscador:focus { border-color: #3b82f6; }
        #resultados-buscar { display: none; margin-top: 6px; max-height: 40vh; overflow-y: auto; background: var(--cuadro-bg); border: 2px solid var(--borde-btn); border-radius: 8px; box-shadow: 0 8px 20px var(--sombra-fuerte); }
        .resultado-buscar { padding: 8px 12px; font-size: 13px; color: var(--texto); cursor: pointer; word-break: break-word; }
        .resultado-buscar:hover { background: var(--bg-btn-hover); }
        .cuadro.padre-potencial { border-color: #10b981 !important; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3); transform: scale(1.05); }

        .cabecera-cuadro { display: flex; align-items: flex-start; gap: 8px; }

        .casilla {
            appearance: none; -webkit-appearance: none; min-width: 18px; height: 18px;
            border: 2px solid var(--texto-secundario); border-radius: 4px; background-color: var(--cuadro-bg);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; margin: 2px 0 0 0; 
        }
        .casilla:checked { background-color: #10b981; border-color: #10b981; }
        .casilla:checked::after { content: '✔'; color: white; font-size: 12px; font-weight: bold; }

        .titulo {
            flex-grow: 1; border: none; font-weight: bold; font-size: 15px; font-family: inherit; 
            outline: none; background: transparent; cursor: text; color: var(--texto);
            resize: none; overflow: hidden; padding: 0; margin: 0; line-height: 1.4;
        }

        .boton-agregar {
            margin: 0 0 10px 0; width: 100%; padding: 6px; cursor: pointer;
            border: 1px dashed var(--borde-btn); background: var(--paso-bg);
            color: var(--texto-secundario); border-radius: 4px; font-weight: bold; transition: all 0.2s;
        }
        .boton-agregar:hover { background: var(--paso-hover); color: var(--texto); }

        /* --- PANEL LATERAL --- */
        #panel-lateral {
            position: fixed;
            top: 0; left: 0; width: 260px; height: 100vh;
            background-color: var(--panel-bg);
            border-right: 2px solid var(--borde-btn);
            box-shadow: 4px 0 10px var(--sombra);
            z-index: 1001; display: flex; flex-direction: column;
            padding: 20px 15px; box-sizing: border-box;
            transition: background-color 0.2s, border-color 0.2s;
        }

        #panel-lateral.panel-drop-active {
            background-color: var(--paso-hover);
            border-right-color: #3b82f6;
        }

        #panel-lateral h3 { margin: 0 0 15px 0; font-size: 16px; color: var(--texto); }

        .contenedor-input-tarea { display: flex; gap: 8px; margin-bottom: 20px; }

        #input-nueva-tarea {
            flex-grow: 1; padding: 8px; border-radius: 6px;
            border: 1px solid var(--borde-btn); background: var(--cuadro-bg);
            color: var(--texto); font-family: inherit; outline: none;
        }

        #btn-agregar-tarea {
            background-color: #3b82f6; color: white; border: none; border-radius: 6px;
            width: 34px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        #btn-agregar-tarea:hover { background-color: #2563eb; }

        #lista-tareas {
            flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            padding-right: 5px; 
        }

        .item-tarea {
            background-color: var(--cuadro-bg); border: 1px solid var(--borde-btn);
            padding: 10px; border-radius: 6px; cursor: grab; display: flex;
            align-items: flex-start; gap: 8px; box-shadow: 0 2px 4px var(--sombra);
            user-select: none; transition: transform 0.1s;
            box-sizing: border-box; 
        }
        
        .item-tarea:active { cursor: grabbing; transform: scale(0.98); }
        .item-tarea span { flex-grow: 1; font-size: 14px; color: var(--texto); pointer-events: none; }
        
        .btn-eliminar-tarea {
            background: transparent; border: none; color: #ef4444; font-size: 14px;
            cursor: pointer; padding: 0 4px; border-radius: 4px;
        }
        .btn-eliminar-tarea:hover { background-color: rgba(239, 68, 68, 0.1); }

        #barra-pestanas { flex-wrap: wrap; max-width: calc(100vw - 800px); position: fixed; top: 20px; left: 280px; display: flex; gap: 10px; z-index: 1000; }
        
        #indicador-guardado { position: fixed; bottom: 45px; left: 280px; background: #10b981; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; opacity: 0; transition: opacity 0.5s; pointer-events: none; z-index: 1000; }
        #version-app { position: fixed; bottom: 15px; left: 280px; font-size: 13px; font-weight: bold; color: var(--texto-secundario); opacity: 0.7; pointer-events: none; z-index: 1000; user-select: none; }

        #papelera {
            position: fixed; bottom: 85px; left: 285px; 
            width: 60px; height: 60px; 
            background-color: #450a0a; border: 2px dashed #ef4444; color: #ef4444;
            border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-size: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; z-index: 1000;
        }
        #papelera.activa { background-color: #ef4444 !important; color: white; transform: scale(1.1); }

        .pestana {
            padding: 8px 16px; background-color: var(--bg-btn); border: 2px solid var(--borde-btn);
            border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--texto-secundario);
            box-shadow: 0 2px 4px var(--sombra); transition: all 0.2s; user-select: none; display: flex; align-items: center; gap: 8px;
        }
        .pestana:hover:not(.activa) { background-color: var(--bg-btn-hover); color: var(--texto); }
        .pestana.activa { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .btn-cerrar-pestana { color: #ef4444; font-size: 12px; border-radius: 50%; width: 18px; height: 18px; display: flex; justify-content: center; align-items: center; transition: background 0.2s; }
        .pestana.activa .btn-cerrar-pestana { color: #fee2e2; }
        .btn-cerrar-pestana:hover { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .pestana-nueva { color: #3b82f6; border-style: dashed; justify-content: center; }

        #menu-respaldo { 
            position: fixed; bottom: 20px; right: 20px; 
            display: flex; gap: 8px; z-index: 1000; 
        }
        
        .btn-respaldo {
            padding: 8px 12px; background-color: var(--bg-btn); border: 2px solid var(--borde-btn);
            border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; color: var(--texto);
            box-shadow: 0 2px 4px var(--sombra); transition: all 0.2s;
        }
        .btn-respaldo:hover { background-color: var(--bg-btn-hover); }

        #btn-organizar { background-color: #1e3a8a; color: #93c5fd; border-color: #1e3a8a; }
        #btn-organizar:hover { background-color: #2563eb; color: white; }

    
        /* --- CELULAR Y PANTALLAS TÁCTILES --- */
        html, body { touch-action: manipulation; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
        #btn-drawer { display: none; }
        .btn-al-mapa { display: none; background: none; border: none; color: #10b981; cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 4px; }
        .btn-al-mapa:hover { background-color: rgba(16, 185, 129, 0.12); }
        .asa-mover { display: none; align-items: center; justify-content: center; height: 18px; margin: -6px -4px 4px; color: var(--texto-secundario); font-size: 14px; letter-spacing: 2px; cursor: grab; }
        .lv-meta { display: contents; }
        @media (hover: none) { .meta-cuadro .vacio { opacity: 0.6; } }
        @media (pointer: coarse) {
            .asa-mover { display: flex; }
            .meta-chip { padding: 5px 9px; font-size: 12px; }
            .btn-al-mapa { display: inline-block; }
        }
        @media (max-width: 760px) {
            .btn-al-mapa { display: inline-block; }
            #btn-drawer { display: block; position: fixed; top: 12px; left: 10px; z-index: 1000; width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--borde-btn); background: var(--bg-btn); color: var(--texto); font-size: 18px; cursor: pointer; }
            #panel-lateral { width: 85vw; max-width: 320px; transform: translateX(-100%); transition: transform 0.25s; z-index: 1100; box-shadow: 0 0 30px var(--sombra-fuerte); }
            body.drawer-abierto #panel-lateral { transform: none; }
            #barra-pestanas { top: 12px; left: 58px; right: 10px; max-width: none; flex-wrap: nowrap; overflow-x: auto; }
            #barra-pestanas .pestana { flex: 0 0 auto; }
            #btn-filtro { top: 62px; left: 10px; right: auto; max-width: 120px; }
            #caja-buscar { top: 62px; left: 140px; right: 10px; width: auto; }
            #menu-respaldo { left: 8px; right: 8px; bottom: 8px; overflow-x: auto; flex-wrap: nowrap; justify-content: flex-start; }
            #menu-respaldo .btn-respaldo { flex: 0 0 auto; }
            #papelera { left: 12px; bottom: 64px; }
            #indicador-guardado { left: 84px; bottom: 74px; }
            #version-app { display: none; }
            #panel-ahora { left: 8px; right: 8px; width: auto; bottom: 60px; max-height: 60vh; }
            #vista-lista { left: 0; padding: 112px 10px 70px; }
            #lv-contenido { max-width: none; }
            .lv-fila, #lv-cabecera { min-width: 0; }
            .lv-fila { grid-template-columns: 30px minmax(0, 1fr) 36px; }

    <script>
        const lienzo = document.getElementById('lienzo');
        const contenedorMapa = document.getElementById('contenedor-mapa');
        const capaLineas = document.getElementById('capa-lineas');
        const papelera = document.getElementById('papelera');
        const indicadorGuardado = document.getElementById('indicador-guardado');
        const barraPestanas = document.getElementById('barra-pestanas');
        const panelLateral = document.getElementById('panel-lateral');
        
        const btnExportar = document.getElementById('btn-exportar');
        const btnImportar = document.getElementById('btn-importar');
        const btnOrganizar = document.getElementById('btn-organizar');
        const inputArchivo = document.getElementById('input-archivo');
                const btnAhora = document.getElementById('btn-ahora');
        const panelAhora = document.getElementById('panel-ahora');
        const listaAhora = document.getElementById('ahora-lista');
        const buscador = document.getElementById('buscador');
        const resultadosBuscar = document.getElementById('resultados-buscar');
        
        const TAMANO_GRILLA = 20;

        // --- SISTEMA DEL IMÁN ---
        const modoIman = true; // Imán siempre activado

        // Motor de datos
        let conexiones = []; 
        let idContador = 0; 
        const coloresNivel = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
        const seleccion = new Set();   // cuadros seleccionados (selección múltiple)
        function esDescendiente(nodo, ancestro) {
            const visitados = new Set(); const pila = [ancestro];
            while (pila.length) {
                const actual = pila.pop();
                if (actual === nodo) return true;
                if (visitados.has(actual)) continue;
                visitados.add(actual);
                conexiones.forEach(c => { if (c.padre === actual) pila.push(c.hijo); });
            }
            return false;
        }
        function crearCiclo(padre, hijo) { return padre === hijo || esDescendiente(padre, hijo); }

        let panX = 0, panY = 0;
        let escala = 1;

        // Pestañas
        let listaPestanas = ['General'];
        try { const guardadas = JSON.parse(localStorage.getItem('misTabs')); if (Array.isArray(guardadas) && guardadas.length > 0) listaPestanas = guardadas; } catch (e) {}
        let pestanaActiva = localStorage.getItem('tabActiva') || 'General';
        if (!listaPestanas.includes(pestanaActiva)) pestanaActiva = listaPestanas[0];

        function renderizarPestanas() {
            syncProgramar(); barraPestanas.innerHTML = ''; 
            listaPestanas.forEach(nombre => {
                const btn = document.createElement('div');
                btn.className = 'pestana' + (nombre === pestanaActiva ? ' activa' : '');
                btn.title = "Doble clic para renombrar"; 
                
                const texto = document.createElement('span'); texto.innerText = nombre; btn.appendChild(texto);

                if (listaPestanas.length > 1) {
                    const btnCerrar = document.createElement('div');
                    btnCerrar.className = 'btn-cerrar-pestana'; btnCerrar.innerText = '✖'; btnCerrar.title = "Eliminar proyecto";
                    btnCerrar.addEventListener('click', (evento) => { evento.stopPropagation(); eliminarPestana(nombre); });
                    btn.appendChild(btnCerrar);
                }

                btn.addEventListener('click', () => cambiarPestana(nombre));
                let tmrPestana = null;
                btn.addEventListener('touchstart', () => { tmrPestana = setTimeout(() => { tmrPestana = null; btn.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, cancelable: true })); }, 600); }, { passive: true });
                ['touchend', 'touchmove', 'touchcancel'].forEach(ev => btn.addEventListener(ev, () => { clearTimeout(tmrPestana); }, { passive: true }));
                btn.addEventListener('dblclick', (evento) => {
                    evento.stopPropagation();
                    const nuevoNombre = prompt('Renombrar proyecto:', nombre);
                    const nombreLimpio = nuevoNombre ? nuevoNombre.trim() : '';
                    if (nombreLimpio !== '' && nombreLimpio !== nombre) {
                        
                        if (listaPestanas.includes(nombreLimpio)) { alert('Ya existe un proyecto con ese nombre.'); return; }
                        renombrarPestana(nombre, nombreLimpio);
                    }
                });
                barraPestanas.appendChild(btn);
            });

            const btnNueva = document.createElement('div');
            btnNueva.className = 'pestana pestana-nueva'; btnNueva.innerText = '+ Nueva';
            btnNueva.addEventListener('click', () => {
                const nuevoNombre = prompt('Ingresa el nombre del nuevo proyecto:');
                const nombreLimpio = nuevoNombre ? nuevoNombre.trim() : '';
                if (nombreLimpio !== '' && !listaPestanas.includes(nombreLimpio)) {
                    listaPestanas.push(nombreLimpio); localStorage.setItem('misTabs', JSON.stringify(listaPestanas));
                    cambiarPestana(nombreLimpio);
                }
            });
            barraPestanas.appendChild(btnNueva);
        }

        function renombrarPestana(nombreViejo, nuevoNombre) {
            guardarMapa();
            syncMarcarBorrada(nombreViejo, nuevoNombre);
            const datosGuardados = localStorage.getItem('mapaDatos_' + nombreViejo);
            if (datosGuardados) { localStorage.setItem('mapaDatos_' + nuevoNombre, datosGuardados); localStorage.removeItem('mapaDatos_' + nombreViejo); }
            const index = listaPestanas.indexOf(nombreViejo);
            if (index !== -1) { listaPestanas[index] = nuevoNombre; localStorage.setItem('misTabs', JSON.stringify(listaPestanas)); }
            if (pestanaActiva === nombreViejo) { pestanaActiva = nuevoNombre; localStorage.setItem('tabActiva', nuevoNombre); }
            renderizarPestanas();
        }

        function eliminarPestana(nombre) {
            if (confirm(`¿Estás seguro de eliminar el proyecto "${nombre}"? Todo su contenido se perderá para siempre.`)) {
                syncMarcarBorrada(nombre); localStorage.removeItem('mapaDatos_' + nombre);
                listaPestanas = listaPestanas.filter(p => p !== nombre);
                localStorage.setItem('misTabs', JSON.stringify(listaPestanas));
                if (pestanaActiva === nombre) cambiarPestana(listaPestanas[0], false); else renderizarPestanas();
            }
        }

        function cambiarPestana(nombre, guardarAntes = true) {
            if (nombre === pestanaActiva) return; 
            if (guardarAntes) guardarMapa(); else clearTimeout(timeoutGuardado); pestanaActiva = nombre; localStorage.setItem('tabActiva', nombre); 
            document.querySelectorAll('.cuadro').forEach(c => c.remove());
            conexiones = []; capaLineas.innerHTML = ''; document.getElementById('lista-tareas').innerHTML = ''; limpiarSeleccion();
            panX = 0; panY = 0; escala = 1; actualizarCamara(); cargarMapa(); renderizarPestanas();
        }

        // Panel lateral
        const inputTarea = document.getElementById('input-nueva-tarea');
        const btnAgregarTarea = document.getElementById('btn-agregar-tarea');
        const listaTareas = document.getElementById('lista-tareas');

        function agregarTareaBandejaDOM(texto) {
            const div = document.createElement('div'); div.className = 'item-tarea';
            const span = document.createElement('span'); span.innerText = texto;
            const btnX = document.createElement('button'); btnX.className = 'btn-eliminar-tarea'; btnX.innerText = '✖';
            btnX.onclick = (e) => { e.stopPropagation(); div.remove(); guardarMapa(); };
            const btnMapa = document.createElement('button'); btnMapa.className = 'btn-al-mapa'; btnMapa.innerText = '➜'; btnMapa.title = 'Pasar al mapa';
            btnMapa.onclick = (e) => { e.stopPropagation(); const c = crearTareaSuelta(span.innerText); div.remove(); guardarMapa(); cerrarDrawer(); if (!modoLista) enfocarCuadro(c); };
            div.appendChild(span); div.appendChild(btnMapa); div.appendChild(btnX); listaTareas.appendChild(div);
        }

        function procesarNuevaTarea() {
            const txt = inputTarea.value.trim();
            if (txt) { agregarTareaBandejaDOM(txt); inputTarea.value = ''; guardarMapa(); }
        }

        btnAgregarTarea.addEventListener('click', procesarNuevaTarea);
        inputTarea.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) procesarNuevaTarea(); });

        let timeoutGuardado;
        let timeoutIndicador;
        function mostrarIndicador(texto, ms) {
            clearTimeout(timeoutIndicador);
            indicadorGuardado.innerText = texto;
            indicadorGuardado.style.opacity = '1';
            timeoutIndicador = setTimeout(() => { indicadorGuardado.style.opacity = '0'; }, ms);
        }
        function mostrarMensajeEspecial(texto) { mostrarIndicador(texto, 2500); }
        function mostrarGuardado() { mostrarIndicador('Guardado ✓', 1000); }
        // --- ESTADOS, PROGRESO Y "¿QUÉ HAGO AHORA?" ---
        // Un cuadro es "bloqueado" si algún paso previo (hijo) sigue sin completar,
        // y "disponible" si no está hecho y todos sus pasos previos sí lo están.
        let estadosPendiente = false;
        function programarEstados() {
            if (estadosPendiente) return;
            estadosPendiente = true;
            requestAnimationFrame(() => { estadosPendiente = false; actualizarEstados(); });
        }

        let ordenAhora = localStorage.getItem('ordenAhora') || 'fecha';
        const ETIQ_PRIORIDAD = ['⚑', '▼ Baja', '● Media', '▲ Alta'];
        const NOM_PRIORIDAD = ['sin prioridad', 'baja', 'media', 'alta'];
        const ETIQ_ESFUERZO = ['⏱', '⚡ Rápida', '⏳ Media', '🧱 Larga'];
        const NOM_ESFUERZO = ['sin estimar', 'rápida', 'media', 'larga'];
        const limitar03 = (v) => Math.min(3, Math.max(0, parseInt(v) || 0));
        function diasHasta(fecha) {
            if (!fecha || !/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return null;
            const [a, m, d] = fecha.split('-').map(Number);
            const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
            return Math.round((new Date(a, m - 1, d) - hoy) / 86400000);
        }
        function textoFecha(fecha) {
            const d = diasHasta(fecha);
            if (d === null) return '';

        function parsearLista(texto) {
            const nodos = []; const pila = [];
            (texto || '').split(/\r?\n/).forEach(linea => {
                if (!/[\p{L}\p{N}]/u.test(linea)) return;
                const ind = linea.match(/^[ \t]*/)[0].replace(/\t/g, '    ').length;

                    return pre;

                nodos.push({ texto: t, completado, etiquetas, padre: pila.length ? pila[pila.length - 1].idx : null });
                pila.push({ ind, idx: nodos.length - 1 });

                    <input type="text" readonly id="sy-codigo-ver"><button class="accion sec" id="sy-copiar">Copiar código</button>
                    <h4>Desvincular</h4>
                    <p>Este dispositivo deja de sincronizar. No se borra nada, ni aquí ni en la nube.</p>

                document.getElementById('sy-codigo-ver').value = 'MAPA1.' + btoa(JSON.stringify({ t: cfg.token, g: cfg.gist, e: cfg.pass ? 1 : 0 }));
                document.getElementById('sy-ahora').addEventListener('click', () => { syncProgramar(0); });
                document.getElementById('sy-copiar').addEventListener('click', async () => {
                    const caja = document.getElementById('sy-codigo-ver');
                    try { await navigator.clipboard.writeText(caja.value); err('Código copiado.', true); } catch (e) { caja.select(); document.execCommand('copy'); err('Código copiado.', true); }
                });
                document.getElementById('sy-desvincular').addEventListener('click', () => {
                    if (!confirm('¿Desvincular este dispositivo? Dejará de sincronizar.')) return;
                    clearTimeout(timerSync); localStorage.removeItem('syncConfig'); localStorage.removeItem('syncMeta');
                    syncEstado = { tipo: 'nada', msg: '' }; actualizarBotonSync(); renderModalSync();
                });
                actualizarBotonSync();
            } else {
                modalSync.innerHTML = `<div class="caja"><button class="cerrar" id="sy-cerrar">✕</button>
                    <h3>☁ Sincronizar entre dispositivos</h3>
                    <p>Guarda una copia de tus proyectos en un archivo privado de tu cuenta de GitHub (un "gist") y la mantiene igual en todos tus dispositivos. Necesitas una cuenta gratuita de GitHub.</p>
                    <h4>En el primer dispositivo</h4>
                    <p>Crea un token en <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub</a> (en "Account permissions" elige <b>Gists: Read and write</b>) y pégalo aquí.</p>
                    <input type="password" id="sy-token" placeholder="Token de GitHub" autocomplete="off">
                    <input type="password" id="sy-pass" placeholder="Contraseña para cifrar tus datos (opcional)" autocomplete="new-password">
                    <button class="accion" id="sy-activar">Activar</button>
                    <h4>Ya lo activé en otro dispositivo</h4>
                    <input type="text" id="sy-codigo" placeholder="Código de vinculación" autocomplete="off">
                    <input type="password" id="sy-pass2" placeholder="Contraseña de cifrado (si usaste una)" autocomplete="off">
                    <button class="accion" id="sy-vincular">Vincular</button>
                    <div class="error" id="sy-error"></div></div>`;
                document.getElementById('sy-activar').addEventListener('click', async (ev) => {
                    const boton = ev.target; const token = v('sy-token').trim(), pass = v('sy-pass');
                    if (!token) { err('Pega tu token de GitHub.'); return; }
                    if (pass && !(window.crypto && crypto.subtle)) { err('El cifrado necesita abrir la app desde una dirección https. Déjalo vacío o usa la versión instalada.'); return; }
                    boton.disabled = true; err('Creando el archivo en GitHub…', true);
                    try {
                        if (guardadoPendiente) { clearTimeout(timeoutGuardado); guardarMapa(); }
                        localStorage.setItem('syncConfig', JSON.stringify({ token, gist: '', pass }));
                        const m = syncMetaLeer(); const t = Date.now();
                        listaPestanas.forEach(n => {
                            const d = localStorage.getItem('mapaDatos_' + n);
                            if (d !== null) { m.mod[n] = t; try { m.hash[n] = huellaDe(JSON.parse(d)); } catch (e) {} }
                        });
                        m.ordenMod = t; m.listaHash = JSON.stringify(listaPestanas); syncMetaGuardar(m);
                        const contenido = await empaquetar(snapshotLocal(m, {}, { tabs: {} }, null), pass);
                        const g = await ghFetch('/gists', 'POST', { description: 'Mi Mapa de Objetivos (sincronización)', public: false, files: { [SYNC_ARCHIVO]: { content: contenido } } });
                        localStorage.setItem('syncConfig', JSON.stringify({ token, gist: g.id, pass }));
                        const m2 = syncMetaLeer(); m2.ultima = Date.now(); syncMetaGuardar(m2);
                        syncEstadoSet('ok'); renderModalSync();
                        err('Listo. Copia el código para vincular tus otros dispositivos.', true);

                });
                document.getElementById('sy-vincular').addEventListener('click', async (ev) => {
                    const boton = ev.target; const pass = v('sy-pass2');
                    let o = null;
                    try { o = JSON.parse(atob(v('sy-codigo').trim().replace(/^MAPA1\./, ''))); } catch (e) {}
                    if (!o || !o.t || !o.g) { err('El código no es válido.'); return; }
                    if (o.e && !pass) { err('Este código usa contraseña de cifrado: escríbela en el campo de abajo.'); return; }
                    boton.disabled = true; err('Conectando…', true);
                    try {
                        localStorage.setItem('syncConfig', JSON.stringify({ token: o.t, gist: o.g, pass }));
                        const contenido = await leerRemoto(syncCfg());
                        const remoto = contenido ? await desempaquetar(contenido, pass) : null;
                        const hayRemotos = !!(remoto && remoto.tabs && Object.keys(remoto.tabs).length);
                        const hayLocales = listaPestanas.some(n => localStorage.getItem('mapaDatos_' + n) !== null);
                        if (hayRemotos && (!hayLocales || confirm('Se encontraron datos en la nube.\n\nAceptar = traerlos y reemplazar los de este dispositivo (recomendado).\nCancelar = combinar ambos (en cada proyecto gana la versión más reciente).'))) {
                            aplicarRemotoCompleto(remoto);
                        }
                        cerrarModalSync(); syncEstadoSet('nada'); syncProgramar(0);

            document.getElementById('sy-cerrar').addEventListener('click', cerrarModalSync);

        setInterval(() => { if (!document.hidden) syncProgramar(0); }, 60000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) syncProgramar(500); });
        window.addEventListener('online', () => syncProgramar(500));
        if (syncCfg()) syncMetaGuardar(syncMetaLeer());
        actualizarBotonSync();
        syncProgramar(1500);

        function tituloDe(cuadro) { return cuadro.querySelector('.titulo').value.trim() || '(sin título)'; }
        function tieneTitulo(cuadro) { return cuadro.querySelector('.titulo').value.trim() !== ''; }

        function actualizarEstados() {
            purgarSeleccion();
            const hijosDe = new Map();
            conexiones.forEach(c => { if (!hijosDe.has(c.padre)) hijosDe.set(c.padre, []); hijosDe.get(c.padre).push(c.hijo); });
            const reactivadas = reactivarRepetitivas();
            let disponibles = 0;
            if (filtroEtiquetas.size) { const ex = new Set(todasEtiquetas().map(n => n.toLowerCase())); Array.from(filtroEtiquetas).forEach(n => { if (!ex.has(n)) filtroEtiquetas.delete(n); }); }
            const tienePadre = new Set(conexiones.map(c => c.hijo));
            const visibles = new Set(); const pilaVis = [];
            document.querySelectorAll('.cuadro').forEach(c => { if (!tienePadre.has(c)) pilaVis.push(c); });
            while (pilaVis.length) {
                const c = pilaVis.pop();
                if (visibles.has(c)) continue;
                visibles.add(c);
                if (c.dataset.colapsado !== '1') (hijosDe.get(c) || []).forEach(h => pilaVis.push(h));
            }
            document.querySelectorAll('.cuadro').forEach(cuadro => {
                const hijos = hijosDe.get(cuadro) || [];
                const hechos = hijos.filter(h => h.querySelector('.casilla').checked).length;
                const completado = cuadro.querySelector('.casilla').checked;
                const bloqueado = !completado && hechos < hijos.length;
                const disponible = !completado && !bloqueado;
                pintarFechaCuadro(cuadro, completado);
                cuadro.classList.toggle('filtrado-fuera', !pasaFiltro(cuadro));
                cuadro.classList.toggle('estado-bloqueado', bloqueado);
                cuadro.classList.toggle('estado-disponible', disponible);
                cuadro.classList.toggle('oculto', !visibles.has(cuadro));
                if (disponible && tieneTitulo(cuadro) && pasaFiltro(cuadro)) disponibles++;

                let prog = cuadro.querySelector('.progreso');
                if (hijos.length === 0) { if (prog) prog.remove(); return; }
                if (!prog) {
                    prog = document.createElement('div'); prog.className = 'progreso';
                    prog.innerHTML = '<button class="btn-colapsar" title="Plegar / desplegar esta rama">▾</button><div class="progreso-barra"><div class="progreso-relleno"></div></div><span class="progreso-texto"></span>';
                    prog.querySelector('.btn-colapsar').addEventListener('click', (e) => {
                        e.stopPropagation();
                        cuadro.dataset.colapsado = cuadro.dataset.colapsado === '1' ? '0' : '1';
                        actualizarEstados(); guardarMapa();
                    });
                    cuadro.appendChild(prog);
                }
                prog.querySelector('.progreso-relleno').style.width = (hechos / hijos.length * 100) + '%';
                prog.querySelector('.progreso-texto').innerText = hechos + '/' + hijos.length;
                const btnCol = prog.querySelector('.btn-colapsar');
                if (cuadro.dataset.colapsado === '1') {
                    const vistos = new Set(); const pl = [cuadro];
                    while (pl.length) { (hijosDe.get(pl.pop()) || []).forEach(h => { if (!vistos.has(h)) { vistos.add(h); pl.push(h); } }); }
                    btnCol.innerText = '▸ +' + vistos.size;
                } else { btnCol.innerText = '▾'; }
            });
            btnAhora.innerText = '🎯 ¿Qué hago ahora? (' + disponibles + ')';
            actualizarBotonFiltro();
            if (menuCtx && menuCtx.cuadro && !menuCtx.cuadro.isConnected) cerrarMenuEtiquetas();
            if (notaCtx && !notaCtx.cuadro.isConnected) cerrarNota();
            if (modoLista) renderizarLista();
            if (reactivadas) { guardarMapa(); mostrarMensajeEspecial('🔁 ' + reactivadas + (reactivadas === 1 ? ' tarea repetitiva reactivada' : ' tareas repetitivas reactivadas')); }
            if (panelAhora.style.display === 'block') renderizarPanelAhora(hijosDe);
            dibujarLineas(true);
        }

        function renderizarPanelAhora(hijosDe) {
            const padresDe = new Map();
            hijosDe.forEach((hijos, padre) => hijos.forEach(h => { if (!padresDe.has(h)) padresDe.set(h, []); padresDe.get(h).push(padre); }));
            const contarDependientes = (cuadro) => {
                const visto = new Set(); const pila = [cuadro];
                while (pila.length) { (padresDe.get(pila.pop()) || []).forEach(p => { if (!visto.has(p)) { visto.add(p); pila.push(p); } }); }
                return visto.size;
            };
            const items = Array.from(document.querySelectorAll('.cuadro.estado-disponible')).filter(tieneTitulo).filter(pasaFiltro)
                
                .map(c => ({ c, n: contarDependientes(c), d: diasHasta(c.dataset.fecha), pr: limitar03(c.dataset.prioridad), es: limitar03(c.dataset.esfuerzo) }));
            const cmpFecha = (a, b) => ((a.d === null) - (b.d === null)) || ((a.d || 0) - (b.d || 0));
            const cmpPrio = (a, b) => b.pr - a.pr;
            const cmpEsfuerzo = (a, b) => ((a.es === 0) - (b.es === 0)) || (a.es - b.es);
            const cmpAyuda = (a, b) => b.n - a.n;
            const ordenes = {
                fecha: [cmpFecha, cmpPrio, cmpAyuda, cmpEsfuerzo],
                prioridad: [cmpPrio, cmpFecha, cmpAyuda, cmpEsfuerzo],
                esfuerzo: [cmpEsfuerzo, cmpPrio, cmpFecha, cmpAyuda],
                ayuda: [cmpAyuda, cmpPrio, cmpFecha, cmpEsfuerzo]
            };
            const criterios = ordenes[ordenAhora] || ordenes.fecha;
            items.sort((a, b) => { for (const cmp of criterios) { const x = cmp(a, b); if (x) return x; } return a.c.offsetTop - b.c.offsetTop; });
            document.querySelectorAll('#ahora-orden button').forEach(b => b.classList.toggle('activo', b.dataset.orden === ordenAhora));

            listaAhora.innerHTML = '';
            if (items.length === 0) { listaAhora.innerHTML = '<div class="ahora-vacio">' + (filtroEtiquetas.size ? 'No hay tareas disponibles con ese filtro' : 'No hay tareas pendientes 🎉') + '</div>'; return; }
            items.forEach(({ c, n, d, pr, es }) => {
                const fila = document.createElement('div'); fila.className = 'ahora-item';
                const chk = document.createElement('input'); chk.type = 'checkbox'; chk.title = 'Marcar como hecha';
                chk.addEventListener('change', () => c.querySelector('.casilla').click());
                const txt = document.createElement('div'); txt.className = 'ahora-texto';
                const t = document.createElement('span'); t.innerText = tituloDe(c); txt.appendChild(t);
                const partes = [];
                const tf = textoFecha(c.dataset.fecha); if (tf) partes.push('📅 ' + tf);
                if (pr) partes.push(ETIQ_PRIORIDAD[pr]);
                if (es) partes.push(ETIQ_ESFUERZO[es]);
                if (c.dataset.repetir) partes.push(ETIQ_REP[REPS.indexOf(c.dataset.repetir)]);
                if ((c.nota || '').trim()) partes.push('📝 nota');
                if (c.etiquetas && c.etiquetas.length) partes.push('🏷 ' + c.etiquetas.join(', '));
                if (partes.length) {
                    const sm0 = document.createElement('small'); sm0.innerText = partes.join(' · ');
                    if (d !== null && d < 0) sm0.style.color = '#f87171'; else if (d !== null && d <= 2) sm0.style.color = '#fbbf24';
                    txt.appendChild(sm0);
                }
                if (n > 0) { const sm = document.createElement('small'); sm.innerText = 'Necesaria para ' + n + (n === 1 ? ' tarea' : ' tareas'); txt.appendChild(sm); }
                txt.addEventListener('click', () => enfocarCuadro(c));
                fila.appendChild(chk); fila.appendChild(txt); listaAhora.appendChild(fila);
            });
        }

        function desplegarAncestros(c) {
            const visto = new Set(); const pila = [c]; let cambio = false;
            while (pila.length) {
                const x = pila.pop();
                conexiones.forEach(k => {
                    if (k.hijo === x && !visto.has(k.padre)) {
                        visto.add(k.padre); pila.push(k.padre);
                        if (k.padre.dataset.colapsado === '1') { k.padre.dataset.colapsado = '0'; cambio = true; }
                    }
                });
            }
            if (cambio) { actualizarEstados(); guardarMapa(); }
        }

        function enfocarCuadro(c) {
            if (modoLista) alternarVista(false);
            desplegarAncestros(c);
            if (escala < 0.6) escala = 0.6;
            panX = (anchoPanelLateral() + (window.innerWidth - anchoPanelLateral()) / 2) - (c.offsetLeft + c.offsetWidth / 2) * escala;
            panY = (window.innerHeight / 2) - (c.offsetTop + c.offsetHeight / 2) * escala;
            contenedorMapa.classList.add('animar-camara'); document.body.classList.add('animar-camara');
            actualizarCamara();
            setTimeout(() => { contenedorMapa.classList.remove('animar-camara'); document.body.classList.remove('animar-camara'); pedirGuardado(); }, 500);
            c.classList.add('resaltado-foco'); setTimeout(() => c.classList.remove('resaltado-foco'), 1800);
        }

        document.querySelectorAll('#ahora-orden button').forEach(b => b.addEventListener('click', () => {
            ordenAhora = b.dataset.orden; localStorage.setItem('ordenAhora', ordenAhora); actualizarEstados();
        }));

        btnAhora.addEventListener('click', () => {
            const abierto = panelAhora.style.display === 'block';
            panelAhora.style.display = abierto ? 'none' : 'block';
            if (!abierto) actualizarEstados();
        });

        function pedirGuardado() { guardadoPendiente = true; clearTimeout(timeoutGuardado); timeoutGuardado = setTimeout(guardarMapa, 500); }

        let historial = [], posHistorial = -1, restaurando = false;
        function registrarFoto(foto) {
            if (restaurando || historial[posHistorial] === foto) return;
            historial = historial.slice(0, posHistorial + 1); historial.push(foto);
            if (historial.length > 40) historial.shift();
            posHistorial = historial.length - 1;
        }
        function reiniciarHistorial() { historial = []; posHistorial = -1; }

        // --- REGISTRO DE FECHAS: cuándo se creó y cuándo se modificó por última vez cada tarea ---
        function mapaHijos() { const m = new Map(); conexiones.forEach(k => { if (!m.has(k.padre)) m.set(k.padre, []); m.get(k.padre).push(k.hijo); }); return m; }
        // Lo que cuenta como "tocar" una tarea: su texto, si está hecha, fecha, prioridad, esfuerzo, repetición, etiquetas, nota y sus pasos previos
        function huellaCuadro(c, hijosDe) {
            const hijos = (hijosDe.get(c) || []).map(h => h.dataset.id).sort();
            return JSON.stringify([c.querySelector('.titulo').value, c.querySelector('.casilla').checked, c.dataset.fecha || '', c.dataset.prioridad || 0, c.dataset.esfuerzo || 0, c.dataset.repetir || '', (c.etiquetas || []).join('\u0001'), c.nota || '', hijos]);
        }
        function sellarHuellas() { const hd = mapaHijos(); document.querySelectorAll('.cuadro').forEach(c => { c._huella = huellaCuadro(c, hd); }); }
        function actualizarTocados() {
            const hd = mapaHijos(); const ahora = Date.now();
            document.querySelectorAll('.cuadro').forEach(c => {
                const h = huellaCuadro(c, hd);
                if (c._huella === undefined) { c._huella = h; return; }
                if (c._huella !== h) { c.dataset.tocado = ahora; c._huella = h; }
            });
        }
        function textoFechasCuadro(c) {
            const f = (t) => new Date(Number(t)).toLocaleString([], { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            return 'Creada: ' + f(c.dataset.creado) + ' · Última modificación: ' + f(c.dataset.tocado);
        }

        function recogerDatos() {
            const nodos = [];
            document.querySelectorAll('.cuadro').forEach(c => {
                nodos.push({
                    id: c.dataset.id, nivel: c.dataset.nivel, x: c.offsetLeft, y: c.offsetTop,
                    texto: c.querySelector('.titulo').value, completado: c.querySelector('.casilla').checked,
                    colapsado: c.dataset.colapsado === '1',
                    fecha: c.dataset.fecha || '', prioridad: limitar03(c.dataset.prioridad), esfuerzo: limitar03(c.dataset.esfuerzo), etiquetas: (c.etiquetas || []).slice(), repetir: c.dataset.repetir || '', completadoEn: c.dataset.completadoEn || '', nota: c.nota || '',
                    creado: Number(c.dataset.creado) || 0, tocado: Number(c.dataset.tocado) || 0
                });
            });
            const enlaces = conexiones.map(conn => ({ padreId: conn.padre.dataset.id, hijoId: conn.hijo.dataset.id }));
            const bandeja = [];
            document.querySelectorAll('#lista-tareas .item-tarea span').forEach(span => { bandeja.push(span.innerText); });
            return { nodos, enlaces, bandeja };
        }

        function guardarMapa() {
            guardadoPendiente = false;
            actualizarTocados();
            programarEstados();
            const d = recogerDatos();
            registrarFoto(JSON.stringify(d));
            const datosCompletos = { camara: { panX, panY, escala }, nodos: d.nodos, enlaces: d.enlaces, ultimoId: idContador, bandeja: d.bandeja, invertido: true };
            try { localStorage.setItem('mapaDatos_' + pestanaActiva, JSON.stringify(datosCompletos)); }
            catch (e) { mostrarMensajeEspecial('⚠ No se pudo guardar'); return; }
            syncMarcarCambio(pestanaActiva, d);
            mostrarGuardado();
        }

        function aplicarFoto(foto) {
            restaurando = true;
            const d = JSON.parse(foto);
            document.querySelectorAll('.cuadro').forEach(c => c.remove());
            conexiones = []; capaLineas.innerHTML = ''; listaTareas.innerHTML = ''; limpiarSeleccion();
            d.bandeja.forEach(t => agregarTareaBandejaDOM(t));
            const mapa = {};
            d.nodos.forEach(n => { mapa[n.id] = crearCuadro(n.x, n.y, parseInt(n.nivel), n); });
            d.enlaces.forEach(e => { if (mapa[e.padreId] && mapa[e.hijoId]) conexiones.push({ padre: mapa[e.padreId], hijo: mapa[e.hijoId] }); });
            sellarHuellas();
            dibujarLineas(); guardarMapa();
            restaurando = false;
        }
        function deshacer() { if (posHistorial > 0) { posHistorial--; aplicarFoto(historial[posHistorial]); } }
        function rehacer() { if (posHistorial < historial.length - 1) { posHistorial++; aplicarFoto(historial[posHistorial]); } }

        function actualizarCamara() {
            contenedorMapa.style.transform = `translate(${panX}px, ${panY}px) scale(${escala})`;
            document.body.style.backgroundPosition = `${panX}px ${panY}px`;
        }

        function crearCuadro(x, y, nivel = 0, datosPrevios = null) {
            const cuadro = document.createElement('div');
            cuadro.className = 'cuadro';
            if (datosPrevios && datosPrevios.id) { cuadro.dataset.id = datosPrevios.id; }
            else { idContador++; cuadro.dataset.id = idContador; }
            cuadro.dataset.creado = (datosPrevios && Number(datosPrevios.creado)) || Date.now();
            cuadro.dataset.tocado = (datosPrevios && Number(datosPrevios.tocado)) || cuadro.dataset.creado;
            if (datosPrevios && datosPrevios.id && !Number(datosPrevios.creado)) cuadro.dataset.sinFechas = '1';   // tarea anterior al registro de fechas
            
            cuadro.dataset.nivel = nivel;
            if (datosPrevios && datosPrevios.colapsado) cuadro.dataset.colapsado = '1';
            
            if (modoIman && !datosPrevios) {
                cuadro.style.left = Math.round(x / TAMANO_GRILLA) * TAMANO_GRILLA + 'px'; 
                cuadro.style.top = Math.round(y / TAMANO_GRILLA) * TAMANO_GRILLA + 'px';
            } else { cuadro.style.left = x + 'px'; cuadro.style.top = y + 'px'; }
            
            cuadro.style.borderColor = coloresNivel[nivel % coloresNivel.length];
            
            const cabecera = document.createElement('div'); cabecera.className = 'cabecera-cuadro';
            const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.className = 'casilla';
            
            if (datosPrevios && datosPrevios.completado) { checkbox.checked = true; cuadro.classList.add('completado'); }
            checkbox.addEventListener('change', () => {
                cuadro.dataset.completadoEn = checkbox.checked ? hoyISO() : '';
                if (checkbox.checked) cuadro.classList.add('completado'); else cuadro.classList.remove('completado'); actualizarEstados();

        // --- POSICIONES FIJAS: la misma cuadrícula que usa "Organizar" ---
        // Casillas de tamaño fijo: no dependen del contenido de los cuadros. Un cuadro más alto que la casilla simplemente ocupa dos filas.
        function pasosSlots() {
            // alto de un cuadro "grande" típico (con barra de progreso); en pantallas táctiles es mayor por la franja para arrastrar
            const alto = window.matchMedia('(pointer: coarse)').matches ? 198 : 160;
            return { px: 260, py: Math.ceil((alto + 20) / TAMANO_GRILLA) * TAMANO_GRILLA };
        }

        // Índice por celdas: permite saber rápido qué cuadros hay cerca de una posición, sin revisar todos los cuadros
        const claveCelda = (i, j) => (i + 100000) * 200003 + (j + 100000);
        function agregarAlIndice(indice, r, px, py) {
            const i1 = Math.floor((r.r - 1) / px), j1 = Math.floor((r.b - 1) / py);
            for (let i = Math.floor(r.l / px); i <= i1; i++) for (let j = Math.floor(r.t / py); j <= j1; j++) {
                const k = claveCelda(i, j); const lista = indice.get(k);
                if (lista) lista.push(r); else indice.set(k, [r]);
            }
        }
        function indiceRects(rects, px, py) { const indice = new Map(); rects.forEach(r => agregarAlIndice(indice, r, px, py)); return indice; }
        function hayChoque(indice, px, py, x, y, w, h) {
            const i1 = Math.floor((x + w - 1) / px), j1 = Math.floor((y + h - 1) / py);
            for (let i = Math.floor(x / px); i <= i1; i++) for (let j = Math.floor(y / py); j <= j1; j++) {
                const lista = indice.get(claveCelda(i, j));
                if (lista) for (let k = 0; k < lista.length; k++) { const r = lista[k]; if (x < r.r && x + w > r.l && y < r.b && y + h > r.t) return true; }
            }
            return false;
        }
        function rectsOtros(c) {
            return Array.from(document.querySelectorAll('.cuadro')).filter(b => b !== c && !b.classList.contains('oculto'))
                .map(b => ({ l: b.offsetLeft, t: b.offsetTop, r: b.offsetLeft + b.offsetWidth, b: b.offsetTop + b.offsetHeight }));
        }

        // Mientras se arrastra un cuadro, los demás no se mueven: su índice se calcula una sola vez por arrastre
        let cacheIndice = null;
        function indiceOtros(c, px, py) {
            const arrastrando = (c === elementoArrastrado);
            if (arrastrando && cacheIndice && cacheIndice.c === c && cacheIndice.px === px && cacheIndice.py === py) return cacheIndice.indice;
            const indice = indiceRects(rectsOtros(c), px, py);
            if (arrastrando) cacheIndice = { c, px, py, indice };
            return indice;
        }

        // Las casillas libres más cercanas a (x, y) para el cuadro 'c'
        function slotsCercanos(c, x, y, cuantos, extras = []) {
            const { px, py } = pasosSlots();
            const w = c.offsetWidth, h = c.offsetHeight;
            const indice = extras.length ? indiceRects(rectsOtros(c).concat(extras.map(e => ({ l: e.l, t: e.t, r: e.l + e.w, b: e.t + e.h }))), px, py) : indiceOtros(c, px, py);
            const i0 = Math.round(x / px), j0 = Math.round(y / py);
            let lista = [];
            for (let radio = 3; radio <= 19 && lista.length < cuantos; radio += 4) {
                lista = [];
                for (let i = i0 - radio; i <= i0 + radio; i++) for (let j = j0 - radio; j <= j0 + radio; j++) {
                    const sx = i * px, sy = j * py;
                    if (!hayChoque(indice, px, py, sx, sy, w, h)) lista.push({ x: sx, y: sy, d: Math.hypot(sx - x, sy - y) });
                }
            }
            lista.sort((a, b) => a.d - b.d);
            return lista.slice(0, cuantos);
        }

        // Mueve el cuadro 'c' a la casilla libre más cercana a (x, y)
        function colocarEnSlot(c, x, y) {
            const s = slotsCercanos(c, x, y, 1)[0];
            if (s) { c.style.left = s.x + 'px'; c.style.top = s.y + 'px'; }
            return c;
        }

        // Dónde queda un cuadro al conectarlo como paso previo de 'padre': la casilla de arriba; si está ocupada, la más cercana de esa fila (derecha, izquierda, derecha...)
        function posicionSobrePadre(padre, c) {
            const { px, py } = pasosSlots();
            const w = c.offsetWidth, h = c.offsetHeight;
            const y = Math.floor((padre.offsetTop - h - 20 + 0.5) / py) * py;
            const col0 = Math.round(padre.offsetLeft / px);
            const indice = indiceOtros(c, px, py);
            for (let i = 0; i < 40; i++) {
                const k = i === 0 ? 0 : (i % 2 === 1 ? (i + 1) / 2 : -(i / 2));
                if (!hayChoque(indice, px, py, (col0 + k) * px, y, w, h)) return { x: (col0 + k) * px, y };
            }
            return { x: col0 * px, y };
        }

        // Acomoda todos los cuadros en la casilla libre más cercana a donde están, sin reordenar el mapa. Devuelve cuántos se movieron.
        function alinearACasillas() {
            const { px, py } = pasosSlots();
            const cajas = Array.from(document.querySelectorAll('.cuadro')).sort((a, b) => a.offsetTop - b.offsetTop || a.offsetLeft - b.offsetLeft);
            const indice = new Map(); let movidos = 0;
            cajas.forEach(c => {
                const w = c.offsetWidth, h = c.offsetHeight, x = c.offsetLeft, y = c.offsetTop;
                const i0 = Math.round(x / px), j0 = Math.round(y / py);
                let mejor = null;
                for (let radio = 0; radio <= 60; radio++) {
                    for (let i = i0 - radio; i <= i0 + radio; i++) for (let j = j0 - radio; j <= j0 + radio; j++) {
                        if (Math.max(Math.abs(i - i0), Math.abs(j - j0)) !== radio) continue;
                        const sx = i * px, sy = j * py;
                        if (hayChoque(indice, px, py, sx, sy, w, h)) continue;
                        const d = Math.hypot(sx - x, sy - y);
                        if (!mejor || d < mejor.d) mejor = { x: sx, y: sy, d };
                    }
                    if (mejor && (radio + 0.5) * Math.min(px, py) >= mejor.d) break;
                }
                const dest = mejor || { x, y };
                if (dest.x !== x || dest.y !== y) { c.style.left = dest.x + 'px'; c.style.top = dest.y + 'px'; movidos++; }
                agregarAlIndice(indice, { l: dest.x, t: dest.y, r: dest.x + w, b: dest.y + h }, px, py);
            });
            return movidos;
        }
        // Una sola vez por proyecto y dispositivo (y cada vez que cambia el tamaño de la casilla): alinea los cuadros que quedaron fuera de las casillas
        function alinearCasillasUnaVez() {
            if (!document.querySelector('.cuadro')) return;
            const { px, py } = pasosSlots();
            const clave = 'reticula_' + pestanaActiva, valor = px + 'x' + py;
            if (localStorage.getItem(clave) === valor) return;
            localStorage.setItem(clave, valor);
            const yaGuardado = localStorage.getItem('mapaDatos_' + pestanaActiva) !== null;
            const n = alinearACasillas();
            if (n === 0) return;
            dibujarLineas();
            if (yaGuardado) guardarMapa();
            if (n >= 2) mostrarMensajeEspecial('📐 ' + n + ' cuadros alineados a las casillas (Ctrl+Z deshace)');
        }
        function programarAlineado() { const tab = pestanaActiva; setTimeout(() => { if (tab === pestanaActiva) alinearCasillasUnaVez(); }, 80); }
        // --- SILUETAS: muestran las casillas más cercanas donde puedes soltar el cuadro (la 1ª, más marcada, es la que se usará) ---
        let slotsActuales = []; let elsSiluetas = []; let huboMovimiento = false;
        function quitarSilueta() { elsSiluetas.forEach(e => e.remove()); elsSiluetas = []; }
        function pintarSiluetas(lista, c, conecta, todas = false) {
            while (elsSiluetas.length > lista.length) elsSiluetas.pop().remove();
            lista.forEach((s, i) => {
                let el = elsSiluetas[i];
                if (!el) { el = document.createElement('div'); contenedorMapa.insertBefore(el, contenedorMapa.firstChild); elsSiluetas[i] = el; }
                el.className = 'silueta-cuadro' + ((i === 0 || todas) ? '' : ' candidata') + (conecta && i === 0 ? ' conecta' : '');
                el.style.width = (s.w || c.offsetWidth) + 'px'; el.style.height = (s.h || c.offsetHeight) + 'px';
                el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
            });
        }
        function actualizarSilueta() {
            const c = elementoArrastrado;
            if (!c || c === 'fondo' || c === 'lazo' || papelera.classList.contains('activa') || panelLateral.classList.contains('panel-drop-active')) { quitarSilueta(); return; }
            if (grupoArrastre) {   // grupo: una silueta por cada cuadro, donde caería todo el grupo
                const g = grupoArrastre;
                if (!g.destino || !huboMovimiento) { quitarSilueta(); return; }
                pintarSiluetas(g.miembros.filter(m => !m.oculto).map(m => ({ x: m.l + g.destino.di * g.px, y: m.t + g.destino.dj * g.py, w: m.w, h: m.h })), null, false, true);
                return;
            }
            const padre = document.querySelector('.cuadro.padre-potencial');
            if (padre && !conexiones.some(k => k.padre === padre && k.hijo === c)) pintarSiluetas([posicionSobrePadre(padre, c)], c, true);
            else pintarSiluetas(slotsActuales, c, false);
        }

        // --- SELECCIÓN MÚLTIPLE ---
        // Shift+clic: suma o quita un cuadro · Shift+arrastrar en el fondo: recuadro de selección · Ctrl+clic: el cuadro y toda su rama
        // Al arrastrar un cuadro seleccionado se mueve todo el grupo, sin cambiar su forma, a las casillas libres más cercanas.
        let grupoArrastre = null;
        const lazoEl = document.createElement('div'); lazoEl.id = 'lazo-seleccion'; document.body.appendChild(lazoEl);
        const indicadorSeleccion = document.createElement('div'); indicadorSeleccion.id = 'indicador-seleccion'; document.body.appendChild(indicadorSeleccion);
        function refrescarSeleccionUI() {
            const n = seleccion.size;
            indicadorSeleccion.style.display = n ? 'block' : 'none';
            indicadorSeleccion.innerText = n + (n === 1 ? ' seleccionado' : ' seleccionados') + ' · arrastra uno para mover el grupo · Esc para soltar';
        }
        function marcarSeleccion(b, si) { if (si) { seleccion.add(b); b.classList.add('seleccionado'); } else { seleccion.delete(b); b.classList.remove('seleccionado'); } }
        function limpiarSeleccion() { seleccion.forEach(b => b.classList.remove('seleccionado')); seleccion.clear(); refrescarSeleccionUI(); }
        function purgarSeleccion() { let cambio = false; seleccion.forEach(b => { if (!b.isConnected) { seleccion.delete(b); cambio = true; } }); if (cambio) refrescarSeleccionUI(); }
        function alternarSeleccion(b) { marcarSeleccion(b, !seleccion.has(b)); refrescarSeleccionUI(); }
        function ramaDe(b) {
            const visto = new Set([b]); const pila = [b];
            while (pila.length) { const x = pila.pop(); conexiones.forEach(k => { if (k.padre === x && !visto.has(k.hijo)) { visto.add(k.hijo); pila.push(k.hijo); } }); }
            return Array.from(visto);
        }
        function alternarRama(b) { const quitar = seleccion.has(b); ramaDe(b).forEach(x => marcarSeleccion(x, !quitar)); refrescarSeleccionUI(); }

        function iniciarGrupo(ancla) {
            const { px, py } = pasosSlots();
            const rects = Array.from(document.querySelectorAll('.cuadro')).filter(b => !seleccion.has(b) && !b.classList.contains('oculto'))
                .map(b => ({ l: b.offsetLeft, t: b.offsetTop, r: b.offsetLeft + b.offsetWidth, b: b.offsetTop + b.offsetHeight }));
            grupoArrastre = { ancla, px, py, indice: indiceRects(rects, px, py), destino: null,
                miembros: Array.from(seleccion).filter(b => b.isConnected).map(b => ({ el: b, l: b.offsetLeft, t: b.offsetTop, w: b.offsetWidth, h: b.offsetHeight, oculto: b.classList.contains('oculto') })) };
        }
        // Desplazamiento en casillas (di, dj) más cercano a (dx, dy) con el que ningún cuadro del grupo choca con los que no están seleccionados
        function destinoGrupo(g, dx, dy) {
            const vis = g.miembros.filter(m => !m.oculto);
            const di0 = Math.round(dx / g.px), dj0 = Math.round(dy / g.py);
            for (let radio = 3; radio <= 23; radio += 4) {
                const cand = [];
                for (let i = di0 - radio; i <= di0 + radio; i++) for (let j = dj0 - radio; j <= dj0 + radio; j++) cand.push({ di: i, dj: j, d: Math.hypot(i * g.px - dx, j * g.py - dy) });
                cand.sort((a, b) => a.d - b.d);
                for (const c of cand) if (!vis.some(m => hayChoque(g.indice, g.px, g.py, m.l + c.di * g.px, m.t + c.dj * g.py, m.w, m.h))) return c;
            }
            return null;
        }
        function moverGrupo(dx, dy) {
            const g = grupoArrastre; if (!g) return;
            g.miembros.forEach(m => { m.el.style.left = (m.l + dx) + 'px'; m.el.style.top = (m.t + dy) + 'px'; });
            g.destino = destinoGrupo(g, dx, dy);
            dibujarLineas(true);
        }
        function finalizarGrupo(evento) {
            const g = grupoArrastre; if (!g) return;
            const rp = papelera.getBoundingClientRect();
            const sobrePapelera = evento.clientX > rp.left && evento.clientX < rp.right && evento.clientY > rp.top && evento.clientY < rp.bottom;
            // Soltar el grupo sobre la papelera o el panel lateral cancela el movimiento (no se elimina nada)
            const cancelar = !huboMovimiento || sobrePapelera || sobrePanelLateral(evento.clientX) || !g.destino;
            g.miembros.forEach(m => {
                m.el.style.left = (cancelar ? m.l : m.l + g.destino.di * g.px) + 'px';
                m.el.style.top = (cancelar ? m.t : m.t + g.destino.dj * g.py) + 'px';
            });
            papelera.classList.remove('activa'); panelLateral.classList.remove('panel-drop-active');
            dibujarLineas(); guardarMapa();
        }

        function actualizarLazo() {
            const e = ultimoEventoRaton; if (!e) return;
            Object.assign(lazoEl.style, { display: 'block', left: Math.min(inicioRatonX, e.clientX) + 'px', top: Math.min(inicioRatonY, e.clientY) + 'px',
                width: Math.abs(e.clientX - inicioRatonX) + 'px', height: Math.abs(e.clientY - inicioRatonY) + 'px' });
        }
        function finalizarLazo(evento) {
            lazoEl.style.display = 'none';
            const x1 = Math.min(inicioRatonX, evento.clientX), x2 = Math.max(inicioRatonX, evento.clientX);
            const y1 = Math.min(inicioRatonY, evento.clientY), y2 = Math.max(inicioRatonY, evento.clientY);

        // Con Shift o Ctrl pulsados, el clic sobre un cuadro solo selecciona: no activa botones, casillas ni campos
        document.addEventListener('click', (e) => { if ((e.shiftKey || e.ctrlKey || e.metaKey) && e.target.closest && e.target.closest('.cuadro')) { e.stopPropagation(); e.preventDefault(); } }, true);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && seleccion.size) limpiarSeleccion(); });

        // --- MOVIMIENTO ---
        let elementoArrastrado = null; let inicioRatonX, inicioRatonY; let posInicialElementoX, posInicialElementoY;
        let rafPendiente = false; let ultimoEventoRaton = null; 
        
        let panelItemDrag = null; let currentPlaceholder = null; let panelItemOffsetY = 0;

        function eliminarCuadroConGravedad(cuadroAEliminar) {
            const padresDelEliminado = conexiones.filter(c => c.hijo === cuadroAEliminar).map(c => c.padre);
            const hijosDelEliminado = conexiones.filter(c => c.padre === cuadroAEliminar).map(c => c.hijo);
            
            const xEliminado = cuadroAEliminar.offsetLeft;
            const yEliminado = cuadroAEliminar.offsetTop;
            const nivelEliminado = parseInt(cuadroAEliminar.dataset.nivel) || 0;
            if (seleccion.delete(cuadroAEliminar)) { cuadroAEliminar.classList.remove('seleccionado'); refrescarSeleccionUI(); }

            padresDelEliminado.forEach(padre => {
                hijosDelEliminado.forEach(hijo => {
                    const yaConectado = conexiones.some(c => c.padre === padre && c.hijo === hijo);
                    if (!yaConectado) conexiones.push({ padre: padre, hijo: hijo });
                });
            });

            cuadroAEliminar.remove();   // se quita antes de buscar casillas, para que su lugar quede libre
            const casillasNuevas = [];
            hijosDelEliminado.forEach((hijo) => {
                const destino = slotsCercanos(hijo, xEliminado, yEliminado, 1, casillasNuevas)[0] || { x: xEliminado, y: yEliminado };
                casillasNuevas.push({ l: destino.x, t: destino.y, w: hijo.offsetWidth, h: hijo.offsetHeight });
                
                hijo.classList.add('animar-movimiento');
                hijo.style.left = destino.x + 'px';
                hijo.style.top = destino.y + 'px';
                
                hijo.dataset.nivel = nivelEliminado;
                hijo.style.borderColor = coloresNivel[nivelEliminado % coloresNivel.length];
                
                setTimeout(() => { hijo.classList.remove('animar-movimiento'); }, 500);
            });

            if (hijosDelEliminado.length > 0) {
                let animCostura = setInterval(() => dibujarLineas(true), 16);
                setTimeout(() => clearInterval(animCostura), 500);
            }

            cuadroAEliminar.remove();
            conexiones = conexiones.filter(conexion => conexion.padre !== cuadroAEliminar && conexion.hijo !== cuadroAEliminar);
        }

        document.addEventListener('mousedown', (evento) => {
            if (evento.button === 0 && (evento.shiftKey || evento.ctrlKey || evento.metaKey)) {
                const cuadroSel = evento.target.closest('.cuadro');
                if (cuadroSel) {
                    if (!cuadroSel.classList.contains('oculto')) { evento.preventDefault(); if (evento.shiftKey) alternarSeleccion(cuadroSel); else alternarRama(cuadroSel); }

            if (evento.target.tagName === 'INPUT' || evento.target.tagName === 'TEXTAREA' || 
                evento.target.tagName === 'BUTTON' && !evento.target.classList.contains('item-tarea') || 
                evento.target.closest('.pestana') || evento.target.closest('.btn-respaldo') ||
                evento.target.closest('.grupo-conexion')) return;

            if (evento.button !== 0) return;
            const itemBandeja = evento.target.closest('.item-tarea');
            if (!itemBandeja && !evento.target.closest('#lienzo')) return;
            if (itemBandeja && !evento.target.classList.contains('btn-eliminar-tarea')) {
                panelItemDrag = itemBandeja;
                const rect = itemBandeja.getBoundingClientRect();
                panelItemOffsetY = evento.clientY - rect.top;
                
                currentPlaceholder = document.createElement('div');
                currentPlaceholder.className = 'item-tarea';
                currentPlaceholder.style.opacity = '0.3';
                currentPlaceholder.style.border = '2px dashed var(--borde-btn)';
                currentPlaceholder.style.height = rect.height + 'px'; 
                
                itemBandeja.parentNode.insertBefore(currentPlaceholder, itemBandeja);
                
                panelItemDrag.style.position = 'fixed';
                panelItemDrag.style.width = rect.width + 'px'; 
                panelItemDrag.style.left = rect.left + 'px';
                panelItemDrag.style.top = (evento.clientY - panelItemOffsetY) + 'px';
                panelItemDrag.style.zIndex = '10000';
                panelItemDrag.style.pointerEvents = 'none'; 
                return;
            }

            const cuadro = evento.target.closest('.cuadro');
            if (cuadro) {
                elementoArrastrado = cuadro; huboMovimiento = false; cacheIndice = null; grupoArrastre = null;
                inicioRatonX = evento.clientX; inicioRatonY = evento.clientY;
                posInicialElementoX = cuadro.offsetLeft; posInicialElementoY = cuadro.offsetTop;
                if (seleccion.size > 1 && seleccion.has(cuadro)) iniciarGrupo(cuadro); else if (!seleccion.has(cuadro)) limpiarSeleccion();
            } else {
                elementoArrastrado = 'fondo';
                inicioRatonX = evento.clientX; inicioRatonY = evento.clientY;
                posInicialElementoX = panX; posInicialElementoY = panY;
            }
        });

        document.addEventListener('mousemove', (evento) => {
            ultimoEventoRaton = evento;
