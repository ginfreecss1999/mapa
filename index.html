            }
        });

        function procesarMovimientoFluido() {
            if (!ultimoEventoRaton) { rafPendiente = false; return; }

            if (panelItemDrag) {
                if (!sobrePanelLateral(ultimoEventoRaton.clientX)) {
                    const texto = panelItemDrag.querySelector('span').innerText;
                    currentPlaceholder.remove();
                    panelItemDrag.remove();
                    
                    panelItemDrag = null;
                    currentPlaceholder = null;

                    const mundoX = (ultimoEventoRaton.clientX - panX) / escala;
                    const mundoY = (ultimoEventoRaton.clientY - panY) / escala;
                    const nuevoCuadro = crearCuadro(mundoX - 110, mundoY - 20, 0, { texto: texto, completado: false });
                    
                    elementoArrastrado = nuevoCuadro; huboMovimiento = true; cacheIndice = null; grupoArrastre = null;
                    inicioRatonX = ultimoEventoRaton.clientX; 
                    inicioRatonY = ultimoEventoRaton.clientY;
                    posInicialElementoX = nuevoCuadro.offsetLeft; 
                    posInicialElementoY = nuevoCuadro.offsetTop;
                    
                    guardarMapa();
                } else {
                    panelItemDrag.style.top = (ultimoEventoRaton.clientY - panelItemOffsetY) + 'px';

                    const elementsUnder = document.elementsFromPoint(ultimoEventoRaton.clientX, ultimoEventoRaton.clientY);
                    const targetItem = elementsUnder.find(el => el.classList.contains('item-tarea') && el !== currentPlaceholder);

                    if (targetItem) {
                        const rect = targetItem.getBoundingClientRect();
                        const midY = rect.top + rect.height / 2;
                        if (ultimoEventoRaton.clientY < midY) {
                            targetItem.parentNode.insertBefore(currentPlaceholder, targetItem);
                        } else {
                            targetItem.parentNode.insertBefore(currentPlaceholder, targetItem.nextSibling);
                        }
                    }
                }
                rafPendiente = false;
                return;
            }

            const movX = ultimoEventoRaton.clientX - inicioRatonX; const movY = ultimoEventoRaton.clientY - inicioRatonY;

            if (elementoArrastrado === 'fondo') {
                panX = posInicialElementoX + movX; panY = posInicialElementoY + movY;
                actualizarCamara();
            } else if (elementoArrastrado === 'lazo') {
                actualizarLazo();
            } else if (grupoArrastre) {
                if (Math.hypot(movX, movY) > 4) huboMovimiento = true;
                moverGrupo(movX / escala, movY / escala);
            } else if (elementoArrastrado) {
                let nuevoX = posInicialElementoX + (movX / escala); let nuevoY = posInicialElementoY + (movY / escala);
                
                if (Math.hypot(movX, movY) > 4) huboMovimiento = true;
                slotsActuales = slotsCercanos(elementoArrastrado, nuevoX, nuevoY, 5);

                elementoArrastrado.style.left = nuevoX + 'px'; elementoArrastrado.style.top = nuevoY + 'px';
                dibujarLineas(true); 

                const rectPapelera = papelera.getBoundingClientRect();
                if (ultimoEventoRaton.clientX > rectPapelera.left && ultimoEventoRaton.clientX < rectPapelera.right && ultimoEventoRaton.clientY > rectPapelera.top && ultimoEventoRaton.clientY < rectPapelera.bottom) {

                    if (ultimoEventoRaton.clientX > rect.left && ultimoEventoRaton.clientX < rect.right && ultimoEventoRaton.clientY > rect.top && ultimoEventoRaton.clientY < rect.bottom) {

                }

            rafPendiente = false;
        }

        document.addEventListener('mouseup', (evento) => {
            if (panelItemDrag) {
                panelItemDrag.style.position = ''; panelItemDrag.style.width = '';
                panelItemDrag.style.left = ''; panelItemDrag.style.top = '';
                panelItemDrag.style.zIndex = ''; panelItemDrag.style.pointerEvents = '';
                
                currentPlaceholder.parentNode.insertBefore(panelItemDrag, currentPlaceholder);
                currentPlaceholder.remove();
                
                panelItemDrag = null; currentPlaceholder = null;

                if (elementoArrastrado === 'lazo') finalizarLazo(evento); else finalizarGrupo(evento);
                elementoArrastrado = null; ultimoEventoRaton = null; huboMovimiento = false; slotsActuales = []; cacheIndice = null; grupoArrastre = null;
                return;
            }

            if (elementoArrastrado) {

                if (elementoArrastrado === 'fondo' && Math.hypot(evento.clientX - inicioRatonX, evento.clientY - inicioRatonY) < 4) limpiarSeleccion();
                if (elementoArrastrado !== 'fondo') {

                        if (destino) { elementoArrastrado.style.left = destino.x + 'px'; elementoArrastrado.style.top = destino.y + 'px'; }

                    if (evento.clientX > rectPapelera.left && evento.clientX < rectPapelera.right && evento.clientY > rectPapelera.top && evento.clientY < rectPapelera.bottom) {

                    } else if (sobrePanelLateral(evento.clientX)) {
                        const texto = elementoArrastrado.querySelector('.titulo').value;
                        if (texto.trim() !== '') agregarTareaBandejaDOM(texto);
                        eliminarCuadroConGravedad(elementoArrastrado);
                    } else {
                        const todosLosCuadros = document.querySelectorAll('.cuadro');
                        for (let box of todosLosCuadros) {
                            if (box === elementoArrastrado) continue;
                            const rect = box.getBoundingClientRect();
                            if (evento.clientX > rect.left && evento.clientX < rect.right && evento.clientY > rect.top && evento.clientY < rect.bottom) {
                                const yaConectado = conexiones.some(c => c.padre === box && c.hijo === elementoArrastrado) || crearCiclo(box, elementoArrastrado) || box.classList.contains('oculto');
                                if (!yaConectado) {
                                    conexiones.push({ padre: box, hijo: elementoArrastrado });
                                    
                                    const pos = posicionSobrePadre(box, elementoArrastrado);
                                    elementoArrastrado.style.left = pos.x + 'px';
                                    elementoArrastrado.style.top = pos.y + 'px';
                                    
                                    const nPadre = parseInt(box.dataset.nivel) || 0;
                                    elementoArrastrado.dataset.nivel = nPadre + 1;
                                    elementoArrastrado.style.borderColor = coloresNivel[(nPadre + 1) % coloresNivel.length];
                                }
                                break;
                            }
                        }
                    }
                    dibujarLineas();
                }
                document.querySelectorAll('.padre-potencial').forEach(c => c.classList.remove('padre-potencial'));
                panelLateral.classList.remove('panel-drop-active');
                papelera.classList.remove('activa'); guardarMapa();
            }
            elementoArrastrado = null; ultimoEventoRaton = null; huboMovimiento = false; slotsActuales = []; cacheIndice = null; grupoArrastre = null;
        });

        lienzo.addEventListener('wheel', (evento) => {
            evento.preventDefault(); 
            const escalaAntigua = escala;

            if (evento.deltaY < 0) { escala *= 1.15; } else { escala /= 1.15; }
            escala = Math.min(4, Math.max(0.15, escala));

            const ratonX = evento.clientX; const ratonY = evento.clientY;
            const mundoX = (ratonX - panX) / escalaAntigua; const mundoY = (ratonY - panY) / escalaAntigua;

            panX = ratonX - (mundoX * escala); panY = ratonY - (mundoY * escala); pedirGuardado();
            actualizarCamara();
        }, { passive: false });

        function dibujarLineas(soloActualizarPosiciones = false) {
            dibujarLineasBase(soloActualizarPosiciones);
            Array.from(capaLineas.children).forEach(g => {
                const k = g.conexionRef;
                g.style.display = (k && (k.padre.classList.contains('oculto') || k.hijo.classList.contains('oculto'))) ? 'none' : '';
            });
        }

        function dibujarLineasBase(soloActualizarPosiciones = false) {
            if (!soloActualizarPosiciones || capaLineas.children.length !== conexiones.length || conexiones.some((c, i) => capaLineas.children[i].conexionRef !== c)) {
                capaLineas.innerHTML = ''; 
                conexiones.forEach((conexion, index) => {
                    const x1 = conexion.padre.offsetLeft + (conexion.padre.offsetWidth / 2);
                    const y1 = conexion.padre.offsetTop; 
                    const x2 = conexion.hijo.offsetLeft + (conexion.hijo.offsetWidth / 2);
                    const y2 = conexion.hijo.offsetTop + conexion.hijo.offsetHeight; 
                    
                    const grupo = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    grupo.setAttribute('class', 'grupo-conexion'); grupo.id = 'conexion-' + index; grupo.conexionRef = conexion; 
                    
                    const lineaVisible = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    lineaVisible.setAttribute('x1', x1); lineaVisible.setAttribute('y1', y1);
                    lineaVisible.setAttribute('x2', x2); lineaVisible.setAttribute('y2', y2);
                    lineaVisible.setAttribute('stroke', 'var(--linea)'); lineaVisible.setAttribute('stroke-width', '2'); 
                    
                    const lineaInvisible = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    lineaInvisible.setAttribute('x1', x1); lineaInvisible.setAttribute('y1', y1);
                    lineaInvisible.setAttribute('x2', x2); lineaInvisible.setAttribute('y2', y2);
                    lineaInvisible.setAttribute('stroke', 'transparent'); lineaInvisible.setAttribute('stroke-width', '25'); 
                    
                    grupo.addEventListener('mouseenter', () => { lineaVisible.setAttribute('stroke', '#ef4444'); lineaVisible.setAttribute('stroke-width', '4'); });
                    grupo.addEventListener('mouseleave', () => { lineaVisible.setAttribute('stroke', 'var(--linea)'); lineaVisible.setAttribute('stroke-width', '2'); });

                    grupo.addEventListener('mousedown', (e) => { e.stopPropagation(); conexiones = conexiones.filter(c => c !== conexion); dibujarLineas(); guardarMapa(); });

                    grupo.appendChild(lineaVisible); grupo.appendChild(lineaInvisible); capaLineas.appendChild(grupo); 
                });
            } else {
                conexiones.forEach((conexion, index) => {
                    const x1 = conexion.padre.offsetLeft + (conexion.padre.offsetWidth / 2);
                    const y1 = conexion.padre.offsetTop; 
                    const x2 = conexion.hijo.offsetLeft + (conexion.hijo.offsetWidth / 2);
                    const y2 = conexion.hijo.offsetTop + conexion.hijo.offsetHeight; 
                    
                    const grupo = document.getElementById('conexion-' + index);
                    if (grupo) {
                        grupo.children[0].setAttribute('x1', x1); grupo.children[0].setAttribute('y1', y1);
                        grupo.children[0].setAttribute('x2', x2); grupo.children[0].setAttribute('y2', y2);
                        grupo.children[1].setAttribute('x1', x1); grupo.children[1].setAttribute('y1', y1);
                        grupo.children[1].setAttribute('x2', x2); grupo.children[1].setAttribute('y2', y2);
                    }
                });
            }
        }

        // --- BUSCADOR, DESHACER Y TECLADO ---
        function buscar() {
            const q = buscador.value.trim().toLowerCase();
            resultadosBuscar.innerHTML = '';
            if (!q) { resultadosBuscar.style.display = 'none'; return; }
            const hallados = Array.from(document.querySelectorAll('.cuadro'))
                .filter(c => c.querySelector('.titulo').value.toLowerCase().includes(q) || (c.nota || '').toLowerCase().includes(q)).slice(0, 10);
            resultadosBuscar.style.display = 'block';
            if (hallados.length === 0) { resultadosBuscar.innerHTML = '<div class="ahora-vacio">Sin resultados</div>'; return; }
            hallados.forEach(c => {
                const fila = document.createElement('div'); fila.className = 'resultado-buscar';
                fila.innerText = (c.querySelector('.casilla').checked ? '✔ ' : '') + tituloDe(c) + (c.querySelector('.titulo').value.toLowerCase().includes(q) ? '' : '  📝');
                fila.addEventListener('mousedown', (e) => e.preventDefault());
                fila.addEventListener('click', () => { enfocarCuadro(c); buscador.value = ''; buscar(); buscador.blur(); });
                resultadosBuscar.appendChild(fila);
            });
        }
        buscador.addEventListener('input', buscar);
        buscador.addEventListener('focus', buscar);
        buscador.addEventListener('blur', () => { resultadosBuscar.style.display = 'none'; });
        buscador.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { const primero = resultadosBuscar.querySelector('.resultado-buscar'); if (primero) primero.click(); }
            if (e.key === 'Escape') { buscador.value = ''; buscar(); buscador.blur(); }
        });

        document.getElementById('btn-deshacer').addEventListener('click', deshacer);
        document.getElementById('btn-rehacer').addEventListener('click', rehacer);
        document.addEventListener('keydown', (e) => {
            const t = e.target;
            if (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'checkbox')) return;
            const ctrl = e.ctrlKey || e.metaKey; const k = e.key.toLowerCase();
            if (ctrl && !e.shiftKey && k === 'z') { e.preventDefault(); deshacer(); }
            else if (ctrl && (k === 'y' || (e.shiftKey && k === 'z'))) { e.preventDefault(); rehacer(); }
            else if (!ctrl && e.key === '/') { e.preventDefault(); buscador.focus(); }
        });

        // --- LÓGICA MODO BOLSILLO (CELULAR) ---
        let mvSeccion = 'ahora';
        const mvContenido = document.getElementById('mv-contenido');
        const mvBarraOrden = document.getElementById('mv-barra-orden');
        const mvInput = document.getElementById('mv-input-tarea');
        const mvBtnSync = document.getElementById('mv-btn-sync');

        if (window.matchMedia('(max-width: 760px)').matches) {
            document.body.classList.add('movil-simple');
        }

        function renderizarAppMovil() {
            if (!document.body.classList.contains('movil-simple')) return;

            // Sincronizar estado del botón nube
            const btnSyncOrig = document.getElementById('btn-sync');
            if (btnSyncOrig && mvBtnSync) mvBtnSync.innerText = btnSyncOrig.innerText.replace('Sincronizar', '').trim() || '☁';

            // Contadores en las pestañas
            const hijosDe = mapaHijos();
            const padresDe = new Map();
            hijosDe.forEach((hijos, padre) => hijos.forEach(h => { if (!padresDe.has(h)) padresDe.set(h, []); padresDe.get(h).push(padre); }));
            const contarDep = (c) => {
                const visto = new Set(), pila = [c];
                while (pila.length) (padresDe.get(pila.pop()) || []).forEach(p => { if (!visto.has(p)) { visto.add(p); pila.push(p); } });
                return visto.size;
            };

            const disponibles = Array.from(document.querySelectorAll('.cuadro.estado-disponible')).filter(tieneTitulo);
            const itemsBandeja = Array.from(document.querySelectorAll('#lista-tareas .item-tarea'));

            document.getElementById('mv-tab-ahora').innerText = `🎯 Ahora (${disponibles.length})`;
            document.getElementById('mv-tab-bandeja').innerText = `📥 Bandeja (${itemsBandeja.length})`;
            document.getElementById('mv-tab-ahora').classList.toggle('activo', mvSeccion === 'ahora');
            document.getElementById('mv-tab-bandeja').classList.toggle('activo', mvSeccion === 'bandeja');
            mvBarraOrden.style.display = mvSeccion === 'ahora' ? 'flex' : 'none';

            document.querySelectorAll('#mv-barra-orden button').forEach(b => b.classList.toggle('activo', b.dataset.orden === ordenAhora));
            mvContenido.innerHTML = '';

            if (mvSeccion === 'ahora') {
                const items = disponibles.map(c => ({
                    c, n: contarDep(c), d: diasHasta(c.dataset.fecha),
                    pr: limitar03(c.dataset.prioridad), es: limitar03(c.dataset.esfuerzo)
                }));
                const cmpFecha = (a, b) => ((a.d === null) - (b.d === null)) || ((a.d || 0) - (b.d || 0));
                const cmpPrio = (a, b) => b.pr - a.pr;
                const cmpEsf = (a, b) => ((a.es === 0) - (b.es === 0)) || (a.es - b.es);
                const cmpAyu = (a, b) => b.n - a.n;
                const ordenes = {
                    fecha: [cmpFecha, cmpPrio, cmpAyu, cmpEsf],
                    prioridad: [cmpPrio, cmpFecha, cmpAyu, cmpEsf],
                    esfuerzo: [cmpEsf, cmpPrio, cmpFecha, cmpAyu],
                    ayuda: [cmpAyu, cmpPrio, cmpFecha, cmpEsf]
                };
                const crit = ordenes[ordenAhora] || ordenes.fecha;
                items.sort((a, b) => { for (const f of crit) { const r = f(a, b); if (r) return r; } return a.c.offsetTop - b.c.offsetTop; });

                if (items.length === 0) {
                    mvContenido.innerHTML = '<div class="ahora-vacio" style="text-align:center;padding:30px;">🎉 No tienes tareas pendientes por ahora.</div>';
                    return;
                }

                items.forEach(({ c, n, d, pr, es }) => {
                    const card = document.createElement('div'); card.className = 'mv-tarjeta';
                    const chk = document.createElement('input'); chk.type = 'checkbox';
                    chk.addEventListener('change', () => { c.querySelector('.casilla').click(); });

                    const cuerpo = document.createElement('div'); cuerpo.className = 'mv-cuerpo';
                    const tit = document.createElement('div'); tit.className = 'mv-titulo'; tit.innerText = tituloDe(c);
                    cuerpo.appendChild(tit);

                    const detalles = [];
                    const tf = textoFecha(c.dataset.fecha); if (tf) detalles.push('📅 ' + tf);
                    if (pr) detalles.push(ETIQ_PRIORIDAD[pr]);
                    if (es) detalles.push(ETIQ_ESFUERZO[es]);
                    if (c.dataset.repetir) detalles.push(ETIQ_REP[REPS.indexOf(c.dataset.repetir)]);
                    if (c.etiquetas && c.etiquetas.length) detalles.push('🏷 ' + c.etiquetas.join(', '));
                    if (n > 0) detalles.push('🔗 Destraba ' + n);

                    if (detalles.length) {
                        const meta = document.createElement('div'); meta.className = 'mv-meta';
                        meta.innerText = detalles.join(' · ');
                        if (d !== null && d < 0) meta.style.color = '#f87171';
                        else if (d !== null && d <= 2) meta.style.color = '#fbbf24';
                        cuerpo.appendChild(meta);
                    }

                    const tieneNota = (c.nota || '').trim().length > 0;
                    const btnN = document.createElement('button');
                    btnN.className = 'mv-btn-nota' + (tieneNota ? ' con-nota' : '');
                    btnN.innerText = '📝';
                    btnN.addEventListener('click', (e) => { e.stopPropagation(); abrirNota(c, btnN); });

                    card.appendChild(chk); card.appendChild(cuerpo); card.appendChild(btnN);
                    mvContenido.appendChild(card);
                });
            } else {
                if (itemsBandeja.length === 0) {
                    mvContenido.innerHTML = '<div class="ahora-vacio" style="text-align:center;padding:30px;">📥 La bandeja está vacía.<br><small>Lo que anotes abajo aparecerá en la columna lateral de tu PC.</small></div>';
                    return;
                }
                itemsBandeja.forEach(itemDOM => {
                    const fila = document.createElement('div'); fila.className = 'mv-bandeja-item';
                    const sp = document.createElement('span'); sp.innerText = itemDOM.querySelector('span').innerText;
                    const btnDel = document.createElement('button'); btnDel.className = 'btn-eliminar-tarea'; btnDel.innerText = '✖';
                    btnDel.addEventListener('click', () => { itemDOM.querySelector('.btn-eliminar-tarea').click(); renderizarAppMovil(); });
                    fila.appendChild(sp); fila.appendChild(btnDel);
                    mvContenido.appendChild(fila);
                });
            }
        }

        document.getElementById('mv-tab-ahora').addEventListener('click', () => { mvSeccion = 'ahora'; renderizarAppMovil(); });
        document.getElementById('mv-tab-bandeja').addEventListener('click', () => { mvSeccion = 'bandeja'; renderizarAppMovil(); });
        document.querySelectorAll('#mv-barra-orden button').forEach(b => b.addEventListener('click', () => {
            ordenAhora = b.dataset.orden; localStorage.setItem('ordenAhora', ordenAhora); renderizarAppMovil();
        }));

        function enviarDesdeMovil() {
            const txt = mvInput.value.trim();
            if (!txt) return;
            agregarTareaBandejaDOM(txt);
            mvInput.value = '';
            guardarMapa();
            renderizarAppMovil();
            mostrarMensajeEspecial('📥 Guardado en la bandeja');
        }
        document.getElementById('mv-btn-enviar').addEventListener('click', enviarDesdeMovil);
        mvInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) enviarDesdeMovil(); });

        mvBtnSync.addEventListener('click', () => document.getElementById('btn-sync').click());
        document.getElementById('mv-btn-mapa').addEventListener('click', () => {
            document.body.classList.remove('movil-simple');
        });
        document.getElementById('btn-volver-movil').addEventListener('click', () => {
            document.body.classList.add('movil-simple');
            renderizarAppMovil();
        });

        // Enganchar la actualización móvil a los cambios de estado y sincronización
        const _actualizarEstadosOrig = actualizarEstados;
        actualizarEstados = function() { _actualizarEstadosOrig(); renderizarAppMovil(); };
        const _actualizarBotonSyncOrig = actualizarBotonSync;
        actualizarBotonSync = function() { _actualizarBotonSyncOrig(); if (mvBtnSync) mvBtnSync.innerText = document.getElementById('btn-sync').innerText.replace('Sincronizar', '').trim(); };

        // INICIO
        renderizarPestanas();
        cargarMapa();
    </script>
</body>
</html>
